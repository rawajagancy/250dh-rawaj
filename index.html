<script>
(function(){
  const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz3IuQBG80h6NryVxaDoLoaAWx935cwJvf__pxdtjEkME1d3ZFd99SdcTuu8hvTUZEY/exec';

  const logoSrc = document.querySelector('.brand img')?.src;
  if(logoSrc){
    document.querySelectorAll('img[data-logo]').forEach(img => img.src = logoSrc);
    const fav = document.getElementById('fav');
    if(fav) fav.href = logoSrc;
  }

  // العد التنازلي حتى 20 دسمبر (توقيت المغرب)
  const END = new Date('2026-12-20T23:59:59+01:00');
  const cd = document.getElementById('cd');
  const pad = n => String(Math.max(0, n)).padStart(2, '0');
  let timer;
  function tick(){
    if(!cd) return;
    const diff = END - new Date();
    if(diff <= 0){
      if(timer) clearInterval(timer);
      cd.innerHTML = '<b>00</b><small>ي</small><b>00</b><small>س</small><b>00</b><small>د</small><b>00</b><small>ث</small>';
      return;
    }
    const t = Math.floor(diff / 1000);
    const d = Math.floor(t / 86400);
    const h = Math.floor((t % 86400) / 3600);
    const m = Math.floor((t % 3600) / 60);
    const s = t % 60;
    cd.innerHTML = `<b>${pad(d)}</b><small>ي</small><b>${pad(h)}</b><small>س</small><b>${pad(m)}</b><small>د</small><b>${pad(s)}</b><small>ث</small>`;
  }
  tick();
  timer = setInterval(tick, 1000);

  // إرسال الفورم إلى Google Apps Script + تتبع Lead في Meta Pixel
  const form = document.getElementById('registrationForm');
  const nameInput = document.getElementById('name');
  const phoneInput = document.getElementById('phone');
  const phoneError = document.getElementById('phoneError');
  const sendError = document.getElementById('sendError');
  const thanks = document.getElementById('thanks');
  const tn = document.getElementById('tn');

  form?.addEventListener('submit', function(e){
    e.preventDefault();
    phoneError.style.display = 'none';
    sendError.style.display = 'none';

    const fullName = nameInput.value.trim();
    const cleanPhone = phoneInput.value.replace(/\s+/g, '');

    if(!/^(05|06|07)\d{8}$/.test(cleanPhone)){
      phoneError.style.display = 'block';
      phoneInput.focus();
      return;
    }

    const submitBtn = form.querySelector('button[type="submit"]');
    if(submitBtn) submitBtn.disabled = true;

    const payload = new URLSearchParams({
      name: fullName,
      phone: cleanPhone
    });

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: payload.toString()
    })
    .then(function(){
      if(typeof fbq === 'function'){
        fbq('track', 'Lead', {
          content_name: 'دورة احتراف إعلانات ميتا',
          value: 250,
          currency: 'MAD'
        });
      }
      if(tn) tn.textContent = fullName;
      form.hidden = true;
      thanks.hidden = false;
    })
    .catch(function(){
      sendError.style.display = 'block';
      if(submitBtn) submitBtn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
