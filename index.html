<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دورة احتراف إعلانات ميتا (Meta Ads) | Rawaj Agency</title>
<meta name="description" content="تعلم Meta Ads بالتطبيق: إعداد الحملة، استهداف الجمهور وقراءة النتائج. أونلاين، 250 درهم بدل 500 لمدة محدودة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" id="fav" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1040;--blue:#2F5BFF;--coral:#F2481F;--sun:#FFD23F;--mint:#19C37D;--lilac:#EEEBFF;--sh:4px 5px 0 var(--ink)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Cairo,sans-serif;color:var(--ink);background:#fff;line-height:1.7;font-weight:500}
h1,h2,h3,.logo,.turn{font-family:Lalezar,Cairo,sans-serif;font-weight:400;line-height:1.3}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
section{padding:64px 0}
h2{font-size:clamp(1.9rem,5vw,2.8rem);text-align:center;margin-bottom:12px}
.lead{text-align:center;max-width:620px;margin:0 auto 36px;font-size:1.1rem}
.btn{display:inline-block;background:var(--coral);color:#fff;font:800 1.2rem Cairo,sans-serif;padding:14px 34px;border:3px solid var(--ink);border-radius:14px;box-shadow:var(--sh);text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(2px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.7;cursor:wait}
a:focus-visible,input:focus-visible,button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.pulse{animation:pulse 2s infinite}
.pulse:hover{animation:none}
@keyframes pulse{50%{transform:scale(1.05)}}

.top{background:var(--sun);border-bottom:3px solid var(--ink);padding:8px 12px;text-align:center;font-weight:800;font-size:.95rem}
.cd{display:inline-flex;gap:6px;margin-inline-start:8px;direction:ltr;vertical-align:middle}
.cd b{background:var(--ink);color:var(--sun);border-radius:6px;padding:0 7px;font-variant-numeric:tabular-nums}
.cd small{font-size:.7rem;margin-inline-start:2px}
header{background:#fff;border-bottom:3px solid var(--ink);position:sticky;top:0;z-index:20}
.hd{display:flex;justify-content:space-between;align-items:center;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 1.3rem/1.1 Cairo,sans-serif}
.brand img{width:48px;height:48px;display:block}
.brand small{display:block;font-size:.72rem;font-weight:700;color:var(--blue)}
.flogo{width:92px;height:92px;display:block;margin:0 auto 10px}
header .btn{font-size:1rem;padding:8px 20px;box-shadow:3px 3px 0 var(--ink)}

.hero{background:var(--blue);color:#fff;padding:56px 0 72px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center}
.hero h1{font-size:clamp(2.1rem,6vw,3.5rem)}
.mark{display:inline-block;max-width:100%;background:var(--sun);color:var(--ink);padding:0 14px;border-radius:10px;transform:rotate(-1.5deg);margin-top:10px}
.hero p{font-size:1.2rem;margin:20px 0 26px;max-width:540px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.price{background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:50%;width:132px;height:132px;display:grid;place-content:center;text-align:center;line-height:1.2;font-weight:800;transform:rotate(8deg);box-shadow:var(--sh);animation:stamp .6s .2s both}
.price s{opacity:.65}
.price b{font:2.3rem/1 Lalezar,Cairo,sans-serif}
@keyframes stamp{from{transform:rotate(8deg) scale(2.2);opacity:0}}
.proof{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:24px;font-weight:700}
.hero svg{width:100%;max-width:360px;margin:auto;display:block}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

.pain{background:var(--lilac)}
.bubbles{display:grid;gap:16px;max-width:720px;margin:0 auto}
.bub{background:#fff;border:3px solid var(--ink);border-radius:20px 20px 20px 4px;padding:14px 22px;font-weight:700;font-size:1.1rem;box-shadow:var(--sh);display:flex;gap:14px;align-items:center}
.bub i{font-style:normal;font-size:1.8rem}
.bub:nth-child(even){margin-inline-start:40px;border-radius:20px 20px 4px 20px}
.turn{text-align:center;margin-top:34px;font-size:1.8rem}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.card{border:3px solid var(--ink);border-radius:18px;padding:26px;box-shadow:var(--sh)}
.card:nth-child(1){background:#FFE3DA}.card:nth-child(2){background:#DDE5FF}.card:nth-child(3){background:#D6F5E6}
.card i{font-style:normal;font-size:2.4rem;display:block}
.card h3{font-size:1.5rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:26px 18px;margin-top:28px;counter-reset:s}
.step{background:var(--ink);color:#fff;border-radius:18px;padding:30px 22px 22px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:-18px;inset-inline-start:18px;background:var(--sun);color:var(--ink);font:1.3rem/1 Lalezar,Cairo,sans-serif;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--ink)}
.step h3{font-size:1.35rem;color:var(--sun)}

.bonus{background:var(--ink);color:#fff;text-align:center}
.gifts{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
.gift{background:var(--sun);color:var(--ink);border:3px solid #fff;border-radius:18px;padding:22px 26px;max-width:340px;font-weight:800;font-size:1.1rem;transform:rotate(-2deg)}
.gift:nth-child(2){transform:rotate(2deg);background:var(--mint)}
.gift i{font-style:normal;font-size:2.2rem;display:block}

.reg{background:var(--sun)}
.form{max-width:480px;margin:0 auto;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:30px;box-shadow:6px 7px 0 var(--ink)}
.was{text-align:center;font-weight:800}
.was s{opacity:.6;margin-inline-end:10px}
.was b{font:2.4rem Lalezar,Cairo,sans-serif;color:var(--coral)}
label{display:block;font-weight:800;margin:14px 0 6px}
input{width:100%;padding:14px;border:3px solid var(--ink);border-radius:12px;font:600 1.05rem Cairo,sans-serif}
.err{color:#C81E1E;font-weight:800;font-size:.9rem;margin-top:6px;display:none}
.form .btn{width:100%;margin-top:22px}
.safe{text-align:center;font-size:.9rem;margin-top:12px}

footer{background:var(--ink);color:#fff;text-align:center;padding:28px 20px 80px}
footer a{color:var(--sun);font-weight:700;margin:0 10px}
.wa{position:fixed;bottom:18px;left:18px;width:62px;height:62px;display:grid;place-items:center;background:#16A34A;border:3px solid var(--ink);border-radius:50%;box-shadow:3px 4px 0 var(--ink);z-index:30}
.wa::after{content:"";position:absolute;inset:-3px;border:3px solid #16A34A;border-radius:50%;animation:ring 2.4s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.5);opacity:0}}
.thanks{text-align:center}
.thanks .ok{width:72px;height:72px;margin:0 auto 10px;border-radius:50%;background:var(--mint);border:3px solid var(--ink);display:grid;place-items:center;font-size:2rem;box-shadow:var(--sh)}
.thanks h3{font-size:1.7rem}
.thanks p{margin:10px 0 0}
.hurry{background:var(--lilac);border:3px solid var(--ink);border-radius:14px;padding:12px 14px;font-weight:700}

@media(max-width:800px){.hero .wrap{grid-template-columns:1fr}.hero svg{max-width:280px}section{padding:48px 0}.bub:nth-child(even){margin-inline-start:16px}}
@media(prefers-reduced-motion:reduce){*,*::after{animation:none!important;scroll-behavior:auto!important}}
</style>
