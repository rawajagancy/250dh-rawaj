  </svg>
</a>

<script>
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz3IuQBG80h6NryVxaDoLoaAWx935cwJvf__pxdtjEkME1d3ZFd99SdcTuu8hvTUZEY/exec';

const END = new Date('2026-12-20T23:59:59+01:00');
const bar = document.querySelector('.top'), cd = document.getElementById('cd');
function tick() {
  const t = Math.floor((END - new Date()) / 1000);
  if (t <= 0) { clearInterval(iv); bar.textContent = '🔥 التسجيل مازال مفتوح، لكن المقاعد محدودة'; return; }
  const v = [Math.floor(t / 86400), Math.floor(t % 86400 / 3600), Math.floor(t % 3600 / 60), t % 60], u = ['ي', 'س', 'د', 'ث'];
  cd.innerHTML = v.map((n, i) => <b>${String(n).padStart(2, '0')}<small>${u[i]}</small></b>).join('');
}
const iv = setInterval(tick, 1000); tick();

const logoSrc = document.querySelector('.brand img').src;
document.querySelectorAll('[data-logo]').forEach(i => i.src = logoSrc);
document.getElementById('fav').href = logoSrc;

const form = document.getElementById('registrationForm');
const phoneInput = document.getElementById('phone');
const phoneError = document.getElementById('phoneError');
const sendError = document.getElementById('sendError');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const phone = phoneInput.value
    .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632)
    .replace(/[\s.\-]/g, '')
    .replace(/^(\+212|00212)/, '0');

  if (!/^0[567]\d{8}$/.test(phone)) {
    phoneError.style.display = 'block';
    phoneInput.focus();
    return;
  }
  phoneError.style.display = 'none'; sendError.style.display = 'none';

  const btn = form.querySelector('button');
  btn.disabled = true; btn.textContent = 'جارٍ التسجيل...';

  const data = {
    name: document.getElementById('name').value.trim(),
    phone: phone,
    date: new Date().toLocaleString('ar-MA')
  };

  let ok = true;
  if (!GOOGLE_SCRIPT_URL.startsWith('YOUR_')) {
    try {
      await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
    } catch (err) { console.error(err); ok = false; }
  }

  if (!ok) {
    sendError.style.display = 'block';
    btn.disabled = false; btn.textContent = 'أكّد مقعدي دابا 🔥';
    return;
  }

  if (typeof fbq === 'function') {
    fbq('track', 'Lead', {
      content_name: 'دورة احتراف إعلانات ميتا',
      value: 250,
      currency: 'MAD'
    });
  }

  document.getElementById('tn').textContent = data.name.split(/\s+/)[0];
  document.querySelectorAll('.reg .lead, .form .was, #registrationForm, .form .safe').forEach(el => el.hidden = true);
  const th = document.getElementById('thanks');
  th.hidden = false;
  th.scrollIntoView({ behavior: 'smooth', block: 'center' });
});
</script>
</body>
</html>
